# carbonfox — Neovim palette.
[base]
default          = #f2f4f8
unknown-token    = #ee5396,bold
commandseparator = #b6b8bb
redirection      = #b6b8bb
here-string-tri  = #8cb6ff
here-string-text = #25be6a
here-string-var  = #33b1ff
exec-descriptor  = #3ddbd9
comment          = #6e6f70
correct-subtle   = #25be6a
incorrect-subtle = #ee5396
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #f2f4f8

[command-point]
reserved-word     = #be95ff
subcommand        = #8cb6ff
alias             = #8cb6ff
suffix-alias      = #8cb6ff
global-alias      = #8cb6ff
builtin           = #08bdba
function          = #8cb6ff
command           = #8cb6ff
precommand        = #be95ff
hashed-command    = #8cb6ff
single-sq-bracket = #8cb6ff
double-sq-bracket = #8cb6ff
double-paren      = #b6b8bb

[paths]
path          = #8cb6ff
pathseparator = #8cb6ff
path-to-dir   = #8cb6ff,underline
globbing      = #8cb6ff
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #ee5396
bracket-level-2 = #08bdba
bracket-level-3 = #8cb6ff

[arguments]
single-hyphen-option   = #08bdba
double-hyphen-option   = #08bdba
back-quoted-argument   = #8cb6ff
single-quoted-argument = #25be6a
double-quoted-argument = #25be6a
dollar-quoted-argument = #25be6a
optarg-string          = #25be6a
optarg-number          = #3ddbd9

[in-string]
back-dollar-quoted-argument           = #3ddbd9
back-or-dollar-double-quoted-argument = #3ddbd9

[other]
variable             = #33b1ff
assign               = none
assign-array-bracket = #8cb6ff
history-expansion    = #8cb6ff

[math]
mathvar = #33b1ff
mathnum = #3ddbd9
matherr = #ee5396,bold

[for-loop]
forvar  = #33b1ff
fornum  = #3ddbd9
foroper = #b6b8bb
forsep  = #8cb6ff

[case]
case-input       = #33b1ff
case-parentheses = #8cb6ff
case-condition   = #be95ff,bold
