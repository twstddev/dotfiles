# monokai-pro-classic — Neovim palette.
[base]
default          = #fdfff1
unknown-token    = #f92672,bold
commandseparator = #f92672
redirection      = #f92672
here-string-tri  = #fd971f
here-string-text = #e6db74
here-string-var  = #fdfff1
exec-descriptor  = #ae81ff
comment          = #6e7066
correct-subtle   = #a6e22e
incorrect-subtle = #f92672
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #fdfff1

[command-point]
reserved-word     = #f92672
subcommand        = #a6e22e
alias             = #a6e22e
suffix-alias      = #a6e22e
global-alias      = #a6e22e
builtin           = #fdfff1
function          = #a6e22e
command           = #a6e22e
precommand        = #f92672
hashed-command    = #a6e22e
single-sq-bracket = #fdfff1
double-sq-bracket = #fdfff1
double-paren      = #f92672

[paths]
path          = #a6e22e
pathseparator = #fdfff1
path-to-dir   = #a6e22e,underline
globbing      = #fd971f
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #f92672
bracket-level-2 = #fdfff1
bracket-level-3 = #fdfff1

[arguments]
single-hyphen-option   = #fdfff1
double-hyphen-option   = #fdfff1
back-quoted-argument   = #fd971f
single-quoted-argument = #e6db74
double-quoted-argument = #e6db74
dollar-quoted-argument = #e6db74
optarg-string          = #e6db74
optarg-number          = #ae81ff

[in-string]
back-dollar-quoted-argument           = #ae81ff
back-or-dollar-double-quoted-argument = #ae81ff

[other]
variable             = #fdfff1
assign               = none
assign-array-bracket = #fdfff1
history-expansion    = #fd971f

[math]
mathvar = #fdfff1
mathnum = #ae81ff
matherr = #f92672,bold

[for-loop]
forvar  = #fdfff1
fornum  = #ae81ff
foroper = #f92672
forsep  = #fdfff1

[case]
case-input       = #fdfff1
case-parentheses = #fdfff1
case-condition   = #f92672,bold
