# onedark-light — Neovim palette.
[base]
default          = #383a42
unknown-token    = #e45649,bold
commandseparator = #a626a4
redirection      = #a626a4
here-string-tri  = #e45649
here-string-text = #50a14f
here-string-var  = #e45649
exec-descriptor  = #c18401
comment          = #a0a1a7
correct-subtle   = #50a14f
incorrect-subtle = #e45649
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #383a42

[command-point]
reserved-word     = #a626a4
subcommand        = #4078f2
alias             = #4078f2
suffix-alias      = #4078f2
global-alias      = #4078f2
builtin           = #986801
function          = #4078f2
command           = #4078f2
precommand        = #a626a4
hashed-command    = #4078f2
single-sq-bracket = #818387
double-sq-bracket = #818387
double-paren      = #a626a4

[paths]
path          = #4078f2
pathseparator = #818387
path-to-dir   = #4078f2,underline
globbing      = #e45649
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #e45649
bracket-level-2 = #986801
bracket-level-3 = #818387

[arguments]
single-hyphen-option   = #986801
double-hyphen-option   = #986801
back-quoted-argument   = #e45649
single-quoted-argument = #50a14f
double-quoted-argument = #50a14f
dollar-quoted-argument = #50a14f
optarg-string          = #50a14f
optarg-number          = #c18401

[in-string]
back-dollar-quoted-argument           = #c18401
back-or-dollar-double-quoted-argument = #c18401

[other]
variable             = #e45649
assign               = none
assign-array-bracket = #818387
history-expansion    = #e45649

[math]
mathvar = #e45649
mathnum = #c18401
matherr = #e45649,bold

[for-loop]
forvar  = #e45649
fornum  = #c18401
foroper = #a626a4
forsep  = #818387

[case]
case-input       = #e45649
case-parentheses = #818387
case-condition   = #a626a4,bold
