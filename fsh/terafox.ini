# terafox — Neovim palette.
[base]
default          = #e6eaea
unknown-token    = #e85c51,bold
commandseparator = #cbd9d8
redirection      = #cbd9d8
here-string-tri  = #73a3b7
here-string-text = #7aa4a1
here-string-var  = #a1cdd8
exec-descriptor  = #ff8349
comment          = #6d7f8b
correct-subtle   = #7aa4a1
incorrect-subtle = #e85c51
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #e6eaea

[command-point]
reserved-word     = #ad5c7c
subcommand        = #73a3b7
alias             = #73a3b7
suffix-alias      = #73a3b7
global-alias      = #73a3b7
builtin           = #fda47f
function          = #73a3b7
command           = #73a3b7
precommand        = #ad5c7c
hashed-command    = #73a3b7
single-sq-bracket = #73a3b7
double-sq-bracket = #73a3b7
double-paren      = #cbd9d8

[paths]
path          = #73a3b7
pathseparator = #73a3b7
path-to-dir   = #73a3b7,underline
globbing      = #73a3b7
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #e85c51
bracket-level-2 = #fda47f
bracket-level-3 = #73a3b7

[arguments]
single-hyphen-option   = #fda47f
double-hyphen-option   = #fda47f
back-quoted-argument   = #73a3b7
single-quoted-argument = #7aa4a1
double-quoted-argument = #7aa4a1
dollar-quoted-argument = #7aa4a1
optarg-string          = #7aa4a1
optarg-number          = #ff8349

[in-string]
back-dollar-quoted-argument           = #ff8349
back-or-dollar-double-quoted-argument = #ff8349

[other]
variable             = #a1cdd8
assign               = none
assign-array-bracket = #73a3b7
history-expansion    = #73a3b7

[math]
mathvar = #a1cdd8
mathnum = #ff8349
matherr = #e85c51,bold

[for-loop]
forvar  = #a1cdd8
fornum  = #ff8349
foroper = #cbd9d8
forsep  = #73a3b7

[case]
case-input       = #a1cdd8
case-parentheses = #73a3b7
case-condition   = #ad5c7c,bold
