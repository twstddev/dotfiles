# monokai-pro-octagon — Neovim palette.
[base]
default          = #eaf2f1
unknown-token    = #ff657a,bold
commandseparator = #ff657a
redirection      = #ff657a
here-string-tri  = #ff9b5e
here-string-text = #ffd76d
here-string-var  = #eaf2f1
exec-descriptor  = #c39ac9
comment          = #696d77
correct-subtle   = #bad761
incorrect-subtle = #ff657a
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #eaf2f1

[command-point]
reserved-word     = #ff657a
subcommand        = #bad761
alias             = #bad761
suffix-alias      = #bad761
global-alias      = #bad761
builtin           = #eaf2f1
function          = #bad761
command           = #bad761
precommand        = #ff657a
hashed-command    = #bad761
single-sq-bracket = #eaf2f1
double-sq-bracket = #eaf2f1
double-paren      = #ff657a

[paths]
path          = #bad761
pathseparator = #eaf2f1
path-to-dir   = #bad761,underline
globbing      = #ff9b5e
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #ff657a
bracket-level-2 = #eaf2f1
bracket-level-3 = #eaf2f1

[arguments]
single-hyphen-option   = #eaf2f1
double-hyphen-option   = #eaf2f1
back-quoted-argument   = #ff9b5e
single-quoted-argument = #ffd76d
double-quoted-argument = #ffd76d
dollar-quoted-argument = #ffd76d
optarg-string          = #ffd76d
optarg-number          = #c39ac9

[in-string]
back-dollar-quoted-argument           = #c39ac9
back-or-dollar-double-quoted-argument = #c39ac9

[other]
variable             = #eaf2f1
assign               = none
assign-array-bracket = #eaf2f1
history-expansion    = #ff9b5e

[math]
mathvar = #eaf2f1
mathnum = #c39ac9
matherr = #ff657a,bold

[for-loop]
forvar  = #eaf2f1
fornum  = #c39ac9
foroper = #ff657a
forsep  = #eaf2f1

[case]
case-input       = #eaf2f1
case-parentheses = #eaf2f1
case-condition   = #ff657a,bold
