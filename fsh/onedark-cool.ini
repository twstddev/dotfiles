# onedark-cool — Neovim palette.
[base]
default          = #a5b0c5
unknown-token    = #ef5f6b,bold
commandseparator = #ca72e4
redirection      = #ca72e4
here-string-tri  = #ef5f6b
here-string-text = #97ca72
here-string-var  = #ef5f6b
exec-descriptor  = #d99a5e
comment          = #546178
correct-subtle   = #97ca72
incorrect-subtle = #ef5f6b
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #a5b0c5

[command-point]
reserved-word     = #ca72e4
subcommand        = #5ab0f6
alias             = #5ab0f6
suffix-alias      = #5ab0f6
global-alias      = #5ab0f6
builtin           = #ebc275
function          = #5ab0f6
command           = #5ab0f6
precommand        = #ca72e4
hashed-command    = #5ab0f6
single-sq-bracket = #7d899f
double-sq-bracket = #7d899f
double-paren      = #ca72e4

[paths]
path          = #5ab0f6
pathseparator = #7d899f
path-to-dir   = #5ab0f6,underline
globbing      = #ef5f6b
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #ef5f6b
bracket-level-2 = #ebc275
bracket-level-3 = #7d899f

[arguments]
single-hyphen-option   = #ebc275
double-hyphen-option   = #ebc275
back-quoted-argument   = #ef5f6b
single-quoted-argument = #97ca72
double-quoted-argument = #97ca72
dollar-quoted-argument = #97ca72
optarg-string          = #97ca72
optarg-number          = #d99a5e

[in-string]
back-dollar-quoted-argument           = #d99a5e
back-or-dollar-double-quoted-argument = #d99a5e

[other]
variable             = #ef5f6b
assign               = none
assign-array-bracket = #7d899f
history-expansion    = #ef5f6b

[math]
mathvar = #ef5f6b
mathnum = #d99a5e
matherr = #ef5f6b,bold

[for-loop]
forvar  = #ef5f6b
fornum  = #d99a5e
foroper = #ca72e4
forsep  = #7d899f

[case]
case-input       = #ef5f6b
case-parentheses = #7d899f
case-condition   = #ca72e4,bold
