# onedark-dark — Neovim palette.
[base]
default          = #abb2bf
unknown-token    = #e86671,bold
commandseparator = #c678dd
redirection      = #c678dd
here-string-tri  = #e86671
here-string-text = #98c379
here-string-var  = #e86671
exec-descriptor  = #d19a66
comment          = #5c6370
correct-subtle   = #98c379
incorrect-subtle = #e86671
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #abb2bf

[command-point]
reserved-word     = #c678dd
subcommand        = #61afef
alias             = #61afef
suffix-alias      = #61afef
global-alias      = #61afef
builtin           = #e5c07b
function          = #61afef
command           = #61afef
precommand        = #c678dd
hashed-command    = #61afef
single-sq-bracket = #848b98
double-sq-bracket = #848b98
double-paren      = #c678dd

[paths]
path          = #61afef
pathseparator = #848b98
path-to-dir   = #61afef,underline
globbing      = #e86671
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #e86671
bracket-level-2 = #e5c07b
bracket-level-3 = #848b98

[arguments]
single-hyphen-option   = #e5c07b
double-hyphen-option   = #e5c07b
back-quoted-argument   = #e86671
single-quoted-argument = #98c379
double-quoted-argument = #98c379
dollar-quoted-argument = #98c379
optarg-string          = #98c379
optarg-number          = #d19a66

[in-string]
back-dollar-quoted-argument           = #d19a66
back-or-dollar-double-quoted-argument = #d19a66

[other]
variable             = #e86671
assign               = none
assign-array-bracket = #848b98
history-expansion    = #e86671

[math]
mathvar = #e86671
mathnum = #d19a66
matherr = #e86671,bold

[for-loop]
forvar  = #e86671
fornum  = #d19a66
foroper = #c678dd
forsep  = #848b98

[case]
case-input       = #e86671
case-parentheses = #848b98
case-condition   = #c678dd,bold
