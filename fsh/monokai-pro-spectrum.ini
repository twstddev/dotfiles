# monokai-pro-spectrum — Neovim palette.
[base]
default          = #f7f1ff
unknown-token    = #fc618d,bold
commandseparator = #fc618d
redirection      = #fc618d
here-string-tri  = #fd9353
here-string-text = #fce566
here-string-var  = #f7f1ff
exec-descriptor  = #948ae3
comment          = #69676c
correct-subtle   = #7bd88f
incorrect-subtle = #fc618d
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #f7f1ff

[command-point]
reserved-word     = #fc618d
subcommand        = #7bd88f
alias             = #7bd88f
suffix-alias      = #7bd88f
global-alias      = #7bd88f
builtin           = #f7f1ff
function          = #7bd88f
command           = #7bd88f
precommand        = #fc618d
hashed-command    = #7bd88f
single-sq-bracket = #f7f1ff
double-sq-bracket = #f7f1ff
double-paren      = #fc618d

[paths]
path          = #7bd88f
pathseparator = #f7f1ff
path-to-dir   = #7bd88f,underline
globbing      = #fd9353
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #fc618d
bracket-level-2 = #f7f1ff
bracket-level-3 = #f7f1ff

[arguments]
single-hyphen-option   = #f7f1ff
double-hyphen-option   = #f7f1ff
back-quoted-argument   = #fd9353
single-quoted-argument = #fce566
double-quoted-argument = #fce566
dollar-quoted-argument = #fce566
optarg-string          = #fce566
optarg-number          = #948ae3

[in-string]
back-dollar-quoted-argument           = #948ae3
back-or-dollar-double-quoted-argument = #948ae3

[other]
variable             = #f7f1ff
assign               = none
assign-array-bracket = #f7f1ff
history-expansion    = #fd9353

[math]
mathvar = #f7f1ff
mathnum = #948ae3
matherr = #fc618d,bold

[for-loop]
forvar  = #f7f1ff
fornum  = #948ae3
foroper = #fc618d
forsep  = #f7f1ff

[case]
case-input       = #f7f1ff
case-parentheses = #f7f1ff
case-condition   = #fc618d,bold
