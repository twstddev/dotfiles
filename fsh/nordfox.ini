# nordfox — Neovim palette.
[base]
default          = #cdcecf
unknown-token    = #bf616a,bold
commandseparator = #abb1bb
redirection      = #abb1bb
here-string-tri  = #8cafd2
here-string-text = #a3be8c
here-string-var  = #88c0d0
exec-descriptor  = #c9826b
comment          = #60728a
correct-subtle   = #a3be8c
incorrect-subtle = #bf616a
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #cdcecf

[command-point]
reserved-word     = #b48ead
subcommand        = #8cafd2
alias             = #8cafd2
suffix-alias      = #8cafd2
global-alias      = #8cafd2
builtin           = #ebcb8b
function          = #8cafd2
command           = #8cafd2
precommand        = #b48ead
hashed-command    = #8cafd2
single-sq-bracket = #8cafd2
double-sq-bracket = #8cafd2
double-paren      = #abb1bb

[paths]
path          = #8cafd2
pathseparator = #8cafd2
path-to-dir   = #8cafd2,underline
globbing      = #8cafd2
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #bf616a
bracket-level-2 = #ebcb8b
bracket-level-3 = #8cafd2

[arguments]
single-hyphen-option   = #ebcb8b
double-hyphen-option   = #ebcb8b
back-quoted-argument   = #8cafd2
single-quoted-argument = #a3be8c
double-quoted-argument = #a3be8c
dollar-quoted-argument = #a3be8c
optarg-string          = #a3be8c
optarg-number          = #c9826b

[in-string]
back-dollar-quoted-argument           = #c9826b
back-or-dollar-double-quoted-argument = #c9826b

[other]
variable             = #88c0d0
assign               = none
assign-array-bracket = #8cafd2
history-expansion    = #8cafd2

[math]
mathvar = #88c0d0
mathnum = #c9826b
matherr = #bf616a,bold

[for-loop]
forvar  = #88c0d0
fornum  = #c9826b
foroper = #abb1bb
forsep  = #8cafd2

[case]
case-input       = #88c0d0
case-parentheses = #8cafd2
case-condition   = #b48ead,bold
