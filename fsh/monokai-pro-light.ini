# monokai-pro-light — Neovim palette.
[base]
default          = #29242a
unknown-token    = #e14775,bold
commandseparator = #e14775
redirection      = #e14775
here-string-tri  = #e16032
here-string-text = #cc7a0a
here-string-var  = #29242a
exec-descriptor  = #7058be
comment          = #a59fa0
correct-subtle   = #269d69
incorrect-subtle = #e14775
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #29242a

[command-point]
reserved-word     = #e14775
subcommand        = #269d69
alias             = #269d69
suffix-alias      = #269d69
global-alias      = #269d69
builtin           = #29242a
function          = #269d69
command           = #269d69
precommand        = #e14775
hashed-command    = #269d69
single-sq-bracket = #29242a
double-sq-bracket = #29242a
double-paren      = #e14775

[paths]
path          = #269d69
pathseparator = #29242a
path-to-dir   = #269d69,underline
globbing      = #e16032
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #e14775
bracket-level-2 = #29242a
bracket-level-3 = #29242a

[arguments]
single-hyphen-option   = #29242a
double-hyphen-option   = #29242a
back-quoted-argument   = #e16032
single-quoted-argument = #cc7a0a
double-quoted-argument = #cc7a0a
dollar-quoted-argument = #cc7a0a
optarg-string          = #cc7a0a
optarg-number          = #7058be

[in-string]
back-dollar-quoted-argument           = #7058be
back-or-dollar-double-quoted-argument = #7058be

[other]
variable             = #29242a
assign               = none
assign-array-bracket = #29242a
history-expansion    = #e16032

[math]
mathvar = #29242a
mathnum = #7058be
matherr = #e14775,bold

[for-loop]
forvar  = #29242a
fornum  = #7058be
foroper = #e14775
forsep  = #29242a

[case]
case-input       = #29242a
case-parentheses = #29242a
case-condition   = #e14775,bold
