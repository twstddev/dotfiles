# dawnfox — Neovim palette.
[base]
default          = #575279
unknown-token    = #b4637a,bold
commandseparator = #625c87
redirection      = #625c87
here-string-tri  = #295e73
here-string-text = #618774
here-string-var  = #56949f
exec-descriptor  = #d7827e
comment          = #9893a5
correct-subtle   = #618774
incorrect-subtle = #b4637a
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #575279

[command-point]
reserved-word     = #907aa9
subcommand        = #295e73
alias             = #295e73
suffix-alias      = #295e73
global-alias      = #295e73
builtin           = #ea9d34
function          = #295e73
command           = #295e73
precommand        = #907aa9
hashed-command    = #295e73
single-sq-bracket = #295e73
double-sq-bracket = #295e73
double-paren      = #625c87

[paths]
path          = #295e73
pathseparator = #295e73
path-to-dir   = #295e73,underline
globbing      = #295e73
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #b4637a
bracket-level-2 = #ea9d34
bracket-level-3 = #295e73

[arguments]
single-hyphen-option   = #ea9d34
double-hyphen-option   = #ea9d34
back-quoted-argument   = #295e73
single-quoted-argument = #618774
double-quoted-argument = #618774
dollar-quoted-argument = #618774
optarg-string          = #618774
optarg-number          = #d7827e

[in-string]
back-dollar-quoted-argument           = #d7827e
back-or-dollar-double-quoted-argument = #d7827e

[other]
variable             = #56949f
assign               = none
assign-array-bracket = #295e73
history-expansion    = #295e73

[math]
mathvar = #56949f
mathnum = #d7827e
matherr = #b4637a,bold

[for-loop]
forvar  = #56949f
fornum  = #d7827e
foroper = #625c87
forsep  = #295e73

[case]
case-input       = #56949f
case-parentheses = #295e73
case-condition   = #907aa9,bold
