# monokai-pro-ristretto — Neovim palette.
[base]
default          = #fff1f3
unknown-token    = #fd6883,bold
commandseparator = #fd6883
redirection      = #fd6883
here-string-tri  = #f38d70
here-string-text = #f9cc6c
here-string-var  = #fff1f3
exec-descriptor  = #a8a9eb
comment          = #72696a
correct-subtle   = #adda78
incorrect-subtle = #fd6883
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #fff1f3

[command-point]
reserved-word     = #fd6883
subcommand        = #adda78
alias             = #adda78
suffix-alias      = #adda78
global-alias      = #adda78
builtin           = #fff1f3
function          = #adda78
command           = #adda78
precommand        = #fd6883
hashed-command    = #adda78
single-sq-bracket = #fff1f3
double-sq-bracket = #fff1f3
double-paren      = #fd6883

[paths]
path          = #adda78
pathseparator = #fff1f3
path-to-dir   = #adda78,underline
globbing      = #f38d70
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #fd6883
bracket-level-2 = #fff1f3
bracket-level-3 = #fff1f3

[arguments]
single-hyphen-option   = #fff1f3
double-hyphen-option   = #fff1f3
back-quoted-argument   = #f38d70
single-quoted-argument = #f9cc6c
double-quoted-argument = #f9cc6c
dollar-quoted-argument = #f9cc6c
optarg-string          = #f9cc6c
optarg-number          = #a8a9eb

[in-string]
back-dollar-quoted-argument           = #a8a9eb
back-or-dollar-double-quoted-argument = #a8a9eb

[other]
variable             = #fff1f3
assign               = none
assign-array-bracket = #fff1f3
history-expansion    = #f38d70

[math]
mathvar = #fff1f3
mathnum = #a8a9eb
matherr = #fd6883,bold

[for-loop]
forvar  = #fff1f3
fornum  = #a8a9eb
foroper = #fd6883
forsep  = #fff1f3

[case]
case-input       = #fff1f3
case-parentheses = #fff1f3
case-condition   = #fd6883,bold
