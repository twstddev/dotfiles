# material-palenight — Neovim palette.
[base]
default          = #a6accd
unknown-token    = #ff5370,bold
commandseparator = #89ddff
redirection      = #89ddff
here-string-tri  = #89ddff
here-string-text = #c3e88d
here-string-var  = #a6accd
exec-descriptor  = #f78c6c
comment          = #676e95
correct-subtle   = #abcf76
incorrect-subtle = #ff5370
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #a6accd

[command-point]
reserved-word     = #c792ea
subcommand        = #82aaff
alias             = #82aaff
suffix-alias      = #82aaff
global-alias      = #82aaff
builtin           = #c792ea
function          = #82aaff
command           = #82aaff
precommand        = #c792ea
hashed-command    = #82aaff
single-sq-bracket = #89ddff
double-sq-bracket = #89ddff
double-paren      = #89ddff

[paths]
path          = #82aaff
pathseparator = #89ddff
path-to-dir   = #82aaff,underline
globbing      = #89ddff
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #ff5370
bracket-level-2 = #c792ea
bracket-level-3 = #89ddff

[arguments]
single-hyphen-option   = #c792ea
double-hyphen-option   = #c792ea
back-quoted-argument   = #89ddff
single-quoted-argument = #c3e88d
double-quoted-argument = #c3e88d
dollar-quoted-argument = #c3e88d
optarg-string          = #c3e88d
optarg-number          = #f78c6c

[in-string]
back-dollar-quoted-argument           = #f78c6c
back-or-dollar-double-quoted-argument = #f78c6c

[other]
variable             = #a6accd
assign               = none
assign-array-bracket = #89ddff
history-expansion    = #89ddff

[math]
mathvar = #a6accd
mathnum = #f78c6c
matherr = #ff5370,bold

[for-loop]
forvar  = #a6accd
fornum  = #f78c6c
foroper = #89ddff
forsep  = #89ddff

[case]
case-input       = #a6accd
case-parentheses = #89ddff
case-condition   = #c792ea,bold
