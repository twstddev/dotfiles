# onedark-warm — Neovim palette.
[base]
default          = #b1b4b9
unknown-token    = #e16d77,bold
commandseparator = #c27fd7
redirection      = #c27fd7
here-string-tri  = #e16d77
here-string-text = #99bc80
here-string-var  = #e16d77
exec-descriptor  = #c99a6e
comment          = #646568
correct-subtle   = #99bc80
incorrect-subtle = #e16d77
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #b1b4b9

[command-point]
reserved-word     = #c27fd7
subcommand        = #68aee8
alias             = #68aee8
suffix-alias      = #68aee8
global-alias      = #68aee8
builtin           = #dfbe81
function          = #68aee8
command           = #68aee8
precommand        = #c27fd7
hashed-command    = #68aee8
single-sq-bracket = #8b8d91
double-sq-bracket = #8b8d91
double-paren      = #c27fd7

[paths]
path          = #68aee8
pathseparator = #8b8d91
path-to-dir   = #68aee8,underline
globbing      = #e16d77
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #e16d77
bracket-level-2 = #dfbe81
bracket-level-3 = #8b8d91

[arguments]
single-hyphen-option   = #dfbe81
double-hyphen-option   = #dfbe81
back-quoted-argument   = #e16d77
single-quoted-argument = #99bc80
double-quoted-argument = #99bc80
dollar-quoted-argument = #99bc80
optarg-string          = #99bc80
optarg-number          = #c99a6e

[in-string]
back-dollar-quoted-argument           = #c99a6e
back-or-dollar-double-quoted-argument = #c99a6e

[other]
variable             = #e16d77
assign               = none
assign-array-bracket = #8b8d91
history-expansion    = #e16d77

[math]
mathvar = #e16d77
mathnum = #c99a6e
matherr = #e16d77,bold

[for-loop]
forvar  = #e16d77
fornum  = #c99a6e
foroper = #c27fd7
forsep  = #8b8d91

[case]
case-input       = #e16d77
case-parentheses = #8b8d91
case-condition   = #c27fd7,bold
