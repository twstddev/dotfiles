# onedark-deep — Neovim palette.
[base]
default          = #93a4c3
unknown-token    = #f65866,bold
commandseparator = #c75ae8
redirection      = #c75ae8
here-string-tri  = #f65866
here-string-text = #8bcd5b
here-string-var  = #f65866
exec-descriptor  = #dd9046
comment          = #455574
correct-subtle   = #8bcd5b
incorrect-subtle = #f65866
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #93a4c3

[command-point]
reserved-word     = #c75ae8
subcommand        = #41a7fc
alias             = #41a7fc
suffix-alias      = #41a7fc
global-alias      = #41a7fc
builtin           = #efbd5d
function          = #41a7fc
command           = #41a7fc
precommand        = #c75ae8
hashed-command    = #41a7fc
single-sq-bracket = #6c7d9c
double-sq-bracket = #6c7d9c
double-paren      = #c75ae8

[paths]
path          = #41a7fc
pathseparator = #6c7d9c
path-to-dir   = #41a7fc,underline
globbing      = #f65866
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #f65866
bracket-level-2 = #efbd5d
bracket-level-3 = #6c7d9c

[arguments]
single-hyphen-option   = #efbd5d
double-hyphen-option   = #efbd5d
back-quoted-argument   = #f65866
single-quoted-argument = #8bcd5b
double-quoted-argument = #8bcd5b
dollar-quoted-argument = #8bcd5b
optarg-string          = #8bcd5b
optarg-number          = #dd9046

[in-string]
back-dollar-quoted-argument           = #dd9046
back-or-dollar-double-quoted-argument = #dd9046

[other]
variable             = #f65866
assign               = none
assign-array-bracket = #6c7d9c
history-expansion    = #f65866

[math]
mathvar = #f65866
mathnum = #dd9046
matherr = #f65866,bold

[for-loop]
forvar  = #f65866
fornum  = #dd9046
foroper = #c75ae8
forsep  = #6c7d9c

[case]
case-input       = #f65866
case-parentheses = #6c7d9c
case-condition   = #c75ae8,bold
