# monokai-pro-pro — Neovim palette.
[base]
default          = #fcfcfa
unknown-token    = #ff6188,bold
commandseparator = #ff6188
redirection      = #ff6188
here-string-tri  = #fc9867
here-string-text = #ffd866
here-string-var  = #fcfcfa
exec-descriptor  = #ab9df2
comment          = #727072
correct-subtle   = #a9dc76
incorrect-subtle = #ff6188
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #fcfcfa

[command-point]
reserved-word     = #ff6188
subcommand        = #a9dc76
alias             = #a9dc76
suffix-alias      = #a9dc76
global-alias      = #a9dc76
builtin           = #fcfcfa
function          = #a9dc76
command           = #a9dc76
precommand        = #ff6188
hashed-command    = #a9dc76
single-sq-bracket = #fcfcfa
double-sq-bracket = #fcfcfa
double-paren      = #ff6188

[paths]
path          = #a9dc76
pathseparator = #fcfcfa
path-to-dir   = #a9dc76,underline
globbing      = #fc9867
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #ff6188
bracket-level-2 = #fcfcfa
bracket-level-3 = #fcfcfa

[arguments]
single-hyphen-option   = #fcfcfa
double-hyphen-option   = #fcfcfa
back-quoted-argument   = #fc9867
single-quoted-argument = #ffd866
double-quoted-argument = #ffd866
dollar-quoted-argument = #ffd866
optarg-string          = #ffd866
optarg-number          = #ab9df2

[in-string]
back-dollar-quoted-argument           = #ab9df2
back-or-dollar-double-quoted-argument = #ab9df2

[other]
variable             = #fcfcfa
assign               = none
assign-array-bracket = #fcfcfa
history-expansion    = #fc9867

[math]
mathvar = #fcfcfa
mathnum = #ab9df2
matherr = #ff6188,bold

[for-loop]
forvar  = #fcfcfa
fornum  = #ab9df2
foroper = #ff6188
forsep  = #fcfcfa

[case]
case-input       = #fcfcfa
case-parentheses = #fcfcfa
case-condition   = #ff6188,bold
