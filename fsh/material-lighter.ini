# material-lighter — Neovim palette.
[base]
default          = #546e7a
unknown-token    = #ff5370,bold
commandseparator = #39adb5
redirection      = #39adb5
here-string-tri  = #39adb5
here-string-text = #91b859
here-string-var  = #546e7a
exec-descriptor  = #f76d47
comment          = #aabfc9
correct-subtle   = #abcf76
incorrect-subtle = #ff5370
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #546e7a

[command-point]
reserved-word     = #7c4dff
subcommand        = #6182b8
alias             = #6182b8
suffix-alias      = #6182b8
global-alias      = #6182b8
builtin           = #7c4dff
function          = #6182b8
command           = #6182b8
precommand        = #7c4dff
hashed-command    = #6182b8
single-sq-bracket = #39adb5
double-sq-bracket = #39adb5
double-paren      = #39adb5

[paths]
path          = #6182b8
pathseparator = #39adb5
path-to-dir   = #6182b8,underline
globbing      = #39adb5
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #ff5370
bracket-level-2 = #7c4dff
bracket-level-3 = #39adb5

[arguments]
single-hyphen-option   = #7c4dff
double-hyphen-option   = #7c4dff
back-quoted-argument   = #39adb5
single-quoted-argument = #91b859
double-quoted-argument = #91b859
dollar-quoted-argument = #91b859
optarg-string          = #91b859
optarg-number          = #f76d47

[in-string]
back-dollar-quoted-argument           = #f76d47
back-or-dollar-double-quoted-argument = #f76d47

[other]
variable             = #546e7a
assign               = none
assign-array-bracket = #39adb5
history-expansion    = #39adb5

[math]
mathvar = #546e7a
mathnum = #f76d47
matherr = #ff5370,bold

[for-loop]
forvar  = #546e7a
fornum  = #f76d47
foroper = #39adb5
forsep  = #39adb5

[case]
case-input       = #546e7a
case-parentheses = #39adb5
case-condition   = #7c4dff,bold
