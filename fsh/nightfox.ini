# nightfox — Neovim palette.
[base]
default          = #cdcecf
unknown-token    = #c94f6d,bold
commandseparator = #aeafb0
redirection      = #aeafb0
here-string-tri  = #86abdc
here-string-text = #81b29a
here-string-var  = #63cdcf
exec-descriptor  = #f4a261
comment          = #738091
correct-subtle   = #81b29a
incorrect-subtle = #c94f6d
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #cdcecf

[command-point]
reserved-word     = #9d79d6
subcommand        = #86abdc
alias             = #86abdc
suffix-alias      = #86abdc
global-alias      = #86abdc
builtin           = #dbc074
function          = #86abdc
command           = #86abdc
precommand        = #9d79d6
hashed-command    = #86abdc
single-sq-bracket = #86abdc
double-sq-bracket = #86abdc
double-paren      = #aeafb0

[paths]
path          = #86abdc
pathseparator = #86abdc
path-to-dir   = #86abdc,underline
globbing      = #86abdc
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #c94f6d
bracket-level-2 = #dbc074
bracket-level-3 = #86abdc

[arguments]
single-hyphen-option   = #dbc074
double-hyphen-option   = #dbc074
back-quoted-argument   = #86abdc
single-quoted-argument = #81b29a
double-quoted-argument = #81b29a
dollar-quoted-argument = #81b29a
optarg-string          = #81b29a
optarg-number          = #f4a261

[in-string]
back-dollar-quoted-argument           = #f4a261
back-or-dollar-double-quoted-argument = #f4a261

[other]
variable             = #63cdcf
assign               = none
assign-array-bracket = #86abdc
history-expansion    = #86abdc

[math]
mathvar = #63cdcf
mathnum = #f4a261
matherr = #c94f6d,bold

[for-loop]
forvar  = #63cdcf
fornum  = #f4a261
foroper = #aeafb0
forsep  = #86abdc

[case]
case-input       = #63cdcf
case-parentheses = #86abdc
case-condition   = #9d79d6,bold
