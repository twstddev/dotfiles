# onedark-darker — Neovim palette.
[base]
default          = #a0a8b7
unknown-token    = #e55561,bold
commandseparator = #bf68d9
redirection      = #bf68d9
here-string-tri  = #e55561
here-string-text = #8ebd6b
here-string-var  = #e55561
exec-descriptor  = #cc9057
comment          = #535965
correct-subtle   = #8ebd6b
incorrect-subtle = #e55561
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #a0a8b7

[command-point]
reserved-word     = #bf68d9
subcommand        = #4fa6ed
alias             = #4fa6ed
suffix-alias      = #4fa6ed
global-alias      = #4fa6ed
builtin           = #e2b86b
function          = #4fa6ed
command           = #4fa6ed
precommand        = #bf68d9
hashed-command    = #4fa6ed
single-sq-bracket = #7a818e
double-sq-bracket = #7a818e
double-paren      = #bf68d9

[paths]
path          = #4fa6ed
pathseparator = #7a818e
path-to-dir   = #4fa6ed,underline
globbing      = #e55561
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #e55561
bracket-level-2 = #e2b86b
bracket-level-3 = #7a818e

[arguments]
single-hyphen-option   = #e2b86b
double-hyphen-option   = #e2b86b
back-quoted-argument   = #e55561
single-quoted-argument = #8ebd6b
double-quoted-argument = #8ebd6b
dollar-quoted-argument = #8ebd6b
optarg-string          = #8ebd6b
optarg-number          = #cc9057

[in-string]
back-dollar-quoted-argument           = #cc9057
back-or-dollar-double-quoted-argument = #cc9057

[other]
variable             = #e55561
assign               = none
assign-array-bracket = #7a818e
history-expansion    = #e55561

[math]
mathvar = #e55561
mathnum = #cc9057
matherr = #e55561,bold

[for-loop]
forvar  = #e55561
fornum  = #cc9057
foroper = #bf68d9
forsep  = #7a818e

[case]
case-input       = #e55561
case-parentheses = #7a818e
case-condition   = #bf68d9,bold
