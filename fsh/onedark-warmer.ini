# onedark-warmer — Neovim palette.
[base]
default          = #a7aab0
unknown-token    = #de5d68,bold
commandseparator = #bb70d2
redirection      = #bb70d2
here-string-tri  = #de5d68
here-string-text = #8fb573
here-string-var  = #de5d68
exec-descriptor  = #c49060
comment          = #5a5b5e
correct-subtle   = #8fb573
incorrect-subtle = #de5d68
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #a7aab0

[command-point]
reserved-word     = #bb70d2
subcommand        = #57a5e5
alias             = #57a5e5
suffix-alias      = #57a5e5
global-alias      = #57a5e5
builtin           = #dbb671
function          = #57a5e5
command           = #57a5e5
precommand        = #bb70d2
hashed-command    = #57a5e5
single-sq-bracket = #818387
double-sq-bracket = #818387
double-paren      = #bb70d2

[paths]
path          = #57a5e5
pathseparator = #818387
path-to-dir   = #57a5e5,underline
globbing      = #de5d68
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #de5d68
bracket-level-2 = #dbb671
bracket-level-3 = #818387

[arguments]
single-hyphen-option   = #dbb671
double-hyphen-option   = #dbb671
back-quoted-argument   = #de5d68
single-quoted-argument = #8fb573
double-quoted-argument = #8fb573
dollar-quoted-argument = #8fb573
optarg-string          = #8fb573
optarg-number          = #c49060

[in-string]
back-dollar-quoted-argument           = #c49060
back-or-dollar-double-quoted-argument = #c49060

[other]
variable             = #de5d68
assign               = none
assign-array-bracket = #818387
history-expansion    = #de5d68

[math]
mathvar = #de5d68
mathnum = #c49060
matherr = #de5d68,bold

[for-loop]
forvar  = #de5d68
fornum  = #c49060
foroper = #bb70d2
forsep  = #818387

[case]
case-input       = #de5d68
case-parentheses = #818387
case-condition   = #bb70d2,bold
