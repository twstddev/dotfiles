# duskfox — Neovim palette.
[base]
default          = #e0def4
unknown-token    = #eb6f92,bold
commandseparator = #cdcbe0
redirection      = #cdcbe0
here-string-tri  = #65b1cd
here-string-text = #a3be8c
here-string-var  = #9ccfd8
exec-descriptor  = #ea9a97
comment          = #817c9c
correct-subtle   = #a3be8c
incorrect-subtle = #eb6f92
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #e0def4

[command-point]
reserved-word     = #c4a7e7
subcommand        = #65b1cd
alias             = #65b1cd
suffix-alias      = #65b1cd
global-alias      = #65b1cd
builtin           = #f6c177
function          = #65b1cd
command           = #65b1cd
precommand        = #c4a7e7
hashed-command    = #65b1cd
single-sq-bracket = #65b1cd
double-sq-bracket = #65b1cd
double-paren      = #cdcbe0

[paths]
path          = #65b1cd
pathseparator = #65b1cd
path-to-dir   = #65b1cd,underline
globbing      = #65b1cd
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #eb6f92
bracket-level-2 = #f6c177
bracket-level-3 = #65b1cd

[arguments]
single-hyphen-option   = #f6c177
double-hyphen-option   = #f6c177
back-quoted-argument   = #65b1cd
single-quoted-argument = #a3be8c
double-quoted-argument = #a3be8c
dollar-quoted-argument = #a3be8c
optarg-string          = #a3be8c
optarg-number          = #ea9a97

[in-string]
back-dollar-quoted-argument           = #ea9a97
back-or-dollar-double-quoted-argument = #ea9a97

[other]
variable             = #9ccfd8
assign               = none
assign-array-bracket = #65b1cd
history-expansion    = #65b1cd

[math]
mathvar = #9ccfd8
mathnum = #ea9a97
matherr = #eb6f92,bold

[for-loop]
forvar  = #9ccfd8
fornum  = #ea9a97
foroper = #cdcbe0
forsep  = #65b1cd

[case]
case-input       = #9ccfd8
case-parentheses = #65b1cd
case-condition   = #c4a7e7,bold
