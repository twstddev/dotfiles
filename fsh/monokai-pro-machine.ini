# monokai-pro-machine — Neovim palette.
[base]
default          = #f2fffc
unknown-token    = #ff6d7e,bold
commandseparator = #ff6d7e
redirection      = #ff6d7e
here-string-tri  = #ffb270
here-string-text = #ffed72
here-string-var  = #f2fffc
exec-descriptor  = #baa0f8
comment          = #6b7678
correct-subtle   = #a2e57b
incorrect-subtle = #ff6d7e
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #f2fffc

[command-point]
reserved-word     = #ff6d7e
subcommand        = #a2e57b
alias             = #a2e57b
suffix-alias      = #a2e57b
global-alias      = #a2e57b
builtin           = #f2fffc
function          = #a2e57b
command           = #a2e57b
precommand        = #ff6d7e
hashed-command    = #a2e57b
single-sq-bracket = #f2fffc
double-sq-bracket = #f2fffc
double-paren      = #ff6d7e

[paths]
path          = #a2e57b
pathseparator = #f2fffc
path-to-dir   = #a2e57b,underline
globbing      = #ffb270
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #ff6d7e
bracket-level-2 = #f2fffc
bracket-level-3 = #f2fffc

[arguments]
single-hyphen-option   = #f2fffc
double-hyphen-option   = #f2fffc
back-quoted-argument   = #ffb270
single-quoted-argument = #ffed72
double-quoted-argument = #ffed72
dollar-quoted-argument = #ffed72
optarg-string          = #ffed72
optarg-number          = #baa0f8

[in-string]
back-dollar-quoted-argument           = #baa0f8
back-or-dollar-double-quoted-argument = #baa0f8

[other]
variable             = #f2fffc
assign               = none
assign-array-bracket = #f2fffc
history-expansion    = #ffb270

[math]
mathvar = #f2fffc
mathnum = #baa0f8
matherr = #ff6d7e,bold

[for-loop]
forvar  = #f2fffc
fornum  = #baa0f8
foroper = #ff6d7e
forsep  = #f2fffc

[case]
case-input       = #f2fffc
case-parentheses = #f2fffc
case-condition   = #ff6d7e,bold
