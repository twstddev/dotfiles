# dayfox — Neovim palette.
[base]
default          = #3d2b5a
unknown-token    = #a5222f,bold
commandseparator = #643f61
redirection      = #643f61
here-string-tri  = #223d90
here-string-text = #396847
here-string-var  = #287980
exec-descriptor  = #955f61
comment          = #837a72
correct-subtle   = #396847
incorrect-subtle = #a5222f
subtle-separator = none
subtle-bg        = none
secondary        =
recursive-base   = #3d2b5a

[command-point]
reserved-word     = #6e33ce
subcommand        = #223d90
alias             = #223d90
suffix-alias      = #223d90
global-alias      = #223d90
builtin           = #ac5402
function          = #223d90
command           = #223d90
precommand        = #6e33ce
hashed-command    = #223d90
single-sq-bracket = #223d90
double-sq-bracket = #223d90
double-paren      = #643f61

[paths]
path          = #223d90
pathseparator = #223d90
path-to-dir   = #223d90,underline
globbing      = #223d90
globbing-ext  = none

[brackets]
paired-bracket  = bold
bracket-level-1 = #a5222f
bracket-level-2 = #ac5402
bracket-level-3 = #223d90

[arguments]
single-hyphen-option   = #ac5402
double-hyphen-option   = #ac5402
back-quoted-argument   = #223d90
single-quoted-argument = #396847
double-quoted-argument = #396847
dollar-quoted-argument = #396847
optarg-string          = #396847
optarg-number          = #955f61

[in-string]
back-dollar-quoted-argument           = #955f61
back-or-dollar-double-quoted-argument = #955f61

[other]
variable             = #287980
assign               = none
assign-array-bracket = #223d90
history-expansion    = #223d90

[math]
mathvar = #287980
mathnum = #955f61
matherr = #a5222f,bold

[for-loop]
forvar  = #287980
fornum  = #955f61
foroper = #643f61
forsep  = #223d90

[case]
case-input       = #287980
case-parentheses = #223d90
case-condition   = #6e33ce,bold
