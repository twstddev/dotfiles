# change prefix
unbind C-b
set -g prefix M-,
bind-key M-, send-prefix

# copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle
unbind -T copy-mode-vi MouseDragEnd1Pane

# split panes
bind-key -T prefix v split-window -h -c "#{pane_current_path}"
bind-key -T prefix s split-window -v -c "#{pane_current_path}"
bind-key -T prefix % split-window -h -c "#{pane_current_path}"
bind-key -T prefix '"' split-window -v -c "#{pane_current_path}"

# session and pane controls
# Alt+a is free in AeroSpace; keep its workspace and window shortcuts intact.
bind -n M-a run-shell -C 'display-popup -E -w #{@popup_width} -h #{@popup_height} -d "#{l:#{pane_current_path}}" "workmux dashboard"'

# Choose the launcher when loading the config, keeping shell checks out of the
# Alt+t keypress path so the popup can receive the following key immediately.
if-shell 'command -v sesh >/dev/null 2>&1' {
  bind -n M-t run-shell -C 'display-popup -E -w #{@popup_width} -h #{@popup_height} /bin/sh ~/.config/tmux/sesh-picker.sh'
} {
  bind -n M-t choose-tree -Zs -O name -f '#{!:@agent_popup_owner}'
}
# Neovim keeps its Sidekick float; other panes toggle a persistent terminal.
bind -n M-i if -F '#{==:#{pane_current_command},nvim}' {
  send-keys M-i
} {
  if -F '#{@agent_popup_owner}' {
    detach-client
  } {
    run-shell -b '/bin/sh ~/.config/tmux/agent-popup.sh #{q:window_id} #{q:pane_current_path} #{q:client_name}'
  }
}
# Reap popup sessions when their owning window disappears, including when its
# entire session is closed. Fixed hook indices keep config reloads idempotent.
set-hook -g window-unlinked[90] 'run-shell -b "/bin/sh ~/.config/tmux/agent-popup.sh --cleanup"'
set-hook -g session-closed[90] 'run-shell -b "/bin/sh ~/.config/tmux/agent-popup.sh --cleanup"'
bind -n M-o switch-client -l
bind -n M-z resize-pane -Z

bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R

bind-key -T prefix t next-window
bind-key -T prefix T previous-window

bind-key -T prefix q kill-pane
bind-key -T prefix C-q kill-window

bind-key -T prefix C command-prompt -p "Name of new window: " "new-window -n '%%'"
bind-key -T prefix N command-prompt -p "Name of new session: " "new-session -s '%%%'"

# layouts
# AeroSpace owns Alt+digits; cycle layouts with prefix then Space instead.
unbind-key -q -T prefix M-1
unbind-key -q -T prefix M-2
unbind-key -q -T prefix M-3
unbind-key -q -T prefix M-4
unbind-key -q -T prefix M-5
unbind-key -q -T prefix M-6
unbind-key -q -T prefix M-7
bind-key -T prefix Space next-layout

bind-key -T prefix W split-window -h -c "#{pane_current_path}" \; select-pane -L \; split-window -v -c "#{pane_current_path}" \; select-pane -U \; resize-pane -t 1 -x 75% -y 65%
bind-key -T prefix A split-window -h -c "#{pane_current_path}" \; select-pane -L \; resize-pane -t 1 -x 75%

# copy and navigation plugins
# let neovim handle M-[ itself (sidekick scroll mode), copy-mode everywhere else
bind -n M-[ if -F '#{==:#{pane_current_command},nvim}' 'send-keys M-[' 'copy-mode'
bind -n M-s if -F '#{==:#{pane_current_command},nvim}' {
  send-keys M-s
} {
  command-prompt -1 -p "character 1:,character 2:" {
    set -g @easy-motion-character-1 "%1"
    set -g @easy-motion-character-2 "%2"
    run-shell -b '#{q:#{E:HOME}}/.tmux/plugins/tmux-easy-motion/scripts/easy_motion.sh #{pid} #{q:session_id} #{q:window_id} #{q:pane_id} bd-f2 #{q:@easy-motion-character-1}#{q:@easy-motion-character-2}'
  }
}
bind -n M-y run -b "#{@fingers-cli} start #{pane_id}"

# reload configuration
bind-key -T prefix r source-file ~/.tmux.conf
