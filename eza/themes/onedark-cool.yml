  branch_main: { foreground: "#a5b0c5" }
  branch_other: { foreground: "#ca72e4" }
  git_clean: { foreground: "#97ca72" }
  git_dirty: { foreground: "#ef5f6b" }

security_context:
  colon: { foreground: "#546178" }
  user: { foreground: "#a5b0c5" }
  role: { foreground: "#ca72e4" }
  typ: { foreground: "#546178" }
  range: { foreground: "#ca72e4" }

file_type:
  image: { foreground: "#d99a5e" }
  video: { foreground: "#ef5f6b" }
  music: { foreground: "#97ca72" }
  lossless: { foreground: "#4dbdcb" }
  crypto: { foreground: "#546178" }
  document: { foreground: "#a5b0c5" }
  compressed: { foreground: "#ca72e4" }
  temp: { foreground: "#ef5f6b" }
  compiled: { foreground: "#ef5f6b" }
  build: { foreground: "#546178" }
  source: { foreground: "#5ab0f6" }

punctuation: { foreground: "#546178" }
date: { foreground: "#d99a5e" }
inode: { foreground: "#546178" }
blocks: { foreground: "#546178" }
