perms:
  user_read: { foreground: "#b0bec5" }
  user_write: { foreground: "#f78c6c" }
  user_execute_file: { foreground: "#abcf76" }
  user_execute_other: { foreground: "#abcf76" }
  group_read: { foreground: "#b0bec5" }
  group_write: { foreground: "#f78c6c" }
  group_execute: { foreground: "#abcf76" }
  other_read: { foreground: "#546e7a" }
  other_write: { foreground: "#f78c6c" }
  other_execute: { foreground: "#abcf76" }
  special_user_file: { foreground: "#c792ea" }
  special_other: { foreground: "#546e7a" }
  attribute: { foreground: "#546e7a" }

size:
  major: { foreground: "#546e7a" }
  minor: { foreground: "#89ddff" }
  number_byte: { foreground: "#b0bec5" }
  number_kilo: { foreground: "#b0bec5" }
  number_mega: { foreground: "#6e98eb" }
  number_giga: { foreground: "#c792ea" }
  number_huge: { foreground: "#c792ea" }
  unit_byte: { foreground: "#546e7a" }
