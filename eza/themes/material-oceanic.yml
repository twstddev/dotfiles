# material-oceanic — Neovim palette.
colourful: true

filekinds:
  normal: { foreground: "#b0bec5" }
  directory: { foreground: "#6e98eb" }
  symlink: { foreground: "#89ddff" }
  pipe: { foreground: "#546e7a" }
  block_device: { foreground: "#dc6068" }
  char_device: { foreground: "#dc6068" }
  socket: { foreground: "#546e7a" }
  special: { foreground: "#c792ea" }
  executable: { foreground: "#abcf76" }
