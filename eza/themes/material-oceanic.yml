  unit_huge: { foreground: "#89ddff" }

users:
  user_you: { foreground: "#b0bec5" }
  user_root: { foreground: "#ff5370" }
  user_other: { foreground: "#c792ea" }
  group_yours: { foreground: "#b0bec5" }
  group_other: { foreground: "#546e7a" }
  group_root: { foreground: "#ff5370" }

links:
  normal: { foreground: "#89ddff" }
  multi_link_file: { foreground: "#89ddff" }

