# core behavior and terminal options
source-file ~/.config/tmux/options.conf

# key bindings
source-file ~/.config/tmux/bindings.conf

# plugins and plugin configuration
source-file ~/.config/tmux/plugins.conf

# semantic theme palette (managed by the `theme` command)
source-file -q ~/.config/tmux/theme.conf

# visual styling (sourced after the palette so @theme_* vars are available)
source-file ~/.config/tmux/styling.conf

# initialize tmux plugin manager last, so all @fingers-*/@easy-motion-* style
# options exist before plugins read them at load time
run "~/.tmux/plugins/tpm/tpm"

# Use Fingers for Alt+y in copy mode instead of tmux-yank's yank-and-put.
bind-key -T copy-mode-vi M-y run-shell -b '#{@fingers-cli} start #{pane_id}'
bind-key -T copy-mode M-y run-shell -b '#{@fingers-cli} start #{pane_id}'

# Plugins initialize their own bindings, so override the agent jump afterwards.
# TODO: Move this to tmux/bindings.conf when tmux-agents is removed.
bind-key -T prefix a run-shell -b 'message=$(workmux last-done 2>&1); if [ -n "$message" ]; then tmux display-message -c #{q:client_name} -l -- "$message" 2>/dev/null || :; fi'
